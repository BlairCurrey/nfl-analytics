[project]
name = "nfl-analytics"
version = "0.1.0"
description = "CLI app for predicting NFL spreads"
authors = [{ name = "Blair Currey", email = "12960453+BlairCurrey@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]

[project.scripts]
nfl = "nfl_analytics.main:main"

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nfl_analytics"]
exclude = [
    "nfl_analytics/data",
    "nfl_analytics/assets",
    "nfl_analytics/docs",
    "nfl_analytics/dev_notebook.ipynb",
]
