name: Benchmark

# Judges the recipe, not one week's model: recomputes the fixed backtest and
# fails if it differs from the committed nfl_analytics/benchmark.json. A change
# to the model, features, or dependencies must update that file (run
# `nfl benchmark --write`), so its effect on accuracy is reviewed as a diff.

on:
  push:
    branches: [main]
    paths: &recipe
      - "nfl_analytics/**"
      - "!nfl_analytics/docs/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/actions/setup/**"
      - ".github/workflows/benchmark.yaml"
  pull_request:
    paths: *recipe
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          data: "true"

      - name: Check benchmark
        run: uv run nfl benchmark --report "$GITHUB_STEP_SUMMARY"
