name: NFL Spread Predictor Pipeline

on:
  schedule:
    # Tuesdays 10:00 UTC: after Monday Night Football, before the next week's games.
    # During the offseason `nfl run-pipeline` finds no matchups and exits cleanly.
    - cron: "0 10 * * 2"
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Restores the most recent play-by-play data so `nfl run-pipeline` only
      # downloads missing seasons and the in-progress season. The key never
      # matches so a fresh cache is saved after every run.
      - name: Cache play-by-play data
        uses: actions/cache@v4
        with:
          path: nfl_analytics/data
          key: pbp-data-${{ github.run_id }}
          restore-keys: |
            pbp-data-

      # Training loads every season into one dataframe and can exhaust runner memory
      # https://github.com/actions/runner-images/discussions/7188#discussioncomment-6750749
      - name: Increase swapfile
        run: |
          df -h
          sudo swapoff -a
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show

      - name: Run weekly pipeline
        run: uv run nfl run-pipeline

      - name: Locate latest run
        id: latest-run
        run: |
          run_dir=$(ls -d nfl_analytics/assets/runs/*/ 2>/dev/null | sort | tail -n 1)

          if [[ -n "$run_dir" && -f "$run_dir/predictions.json" ]]; then
            echo "Latest run with predictions: $run_dir"
            echo "dir=$run_dir" >> "$GITHUB_OUTPUT"
            echo "has_predictions=true" >> "$GITHUB_OUTPUT"
          else
            echo "No predictions produced (offseason?). Skipping release."
            echo "has_predictions=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish predictions release
        if: steps.latest-run.outputs.has_predictions == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.latest-run.outputs.dir }}*
          tag_name: spread-predictor
          body: |
            Latest trained model and spread predictions for upcoming games,
            published automatically every week during the season.

            - **predictions.json:** predicted spreads relative to the home team
            - **matchups.json:** the upcoming matchups that were predicted
            - **model.joblib / scaler.joblib:** the trained model and input scaler
            - **running_average.csv.gz:** running averages used to form matchup inputs
            - **manifest.json:** run id, timestamp, and test-set error metrics

            All files come from the same training run and can be used together
            with `nfl predict`.
